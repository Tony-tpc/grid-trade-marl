response:
  damping: 0.001
  residual_tolerance: 0.0001
  max_iterations: 100
  attempts: 3
  damping_multiplier: 10.0
  krylov_dimension: 100  # GMRES restart dimension; max_iterations counts inner iterations.
kl_coefficient: 0.01
response_trajectories: 8  # Positive integer; independent actions, shared external scenario per DS.
response_baseline: leave_one_out  # leave_one_out requires >=2; none is a variance ablation.
