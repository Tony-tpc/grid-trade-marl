# QMIX 完整默认配置；以下值与 Python QMIXConfig() 一致。
# 仅 schema_version 和 algorithm 必填；其余节或字段省略时使用这里的默认值。
schema_version: 2  # 必填；配置版本，只允许整数 2。
algorithm: qmix  # 必填；选择对应配置类型，切换算法应换整份 YAML。

policy:
  kind: shared_discrete_q  # 可选；组件实现名称，默认值如本行。
  encoder: {kind: identity}
  backbone:
    kind: mlp
    hidden_dims: [128, 128]  # 每项为正整数；允许 []。
    output_dim: 128
    layer_norm: false

mixer:
  kind: qmix_mixer  # 可选；组件实现名称，默认值如本行。
  mixing_dim: 32  # 可选；QMIX 混合网络宽度，必须 > 0。
  encoder: {kind: identity}
  graph: null  # 可选 GNN；节点布局由 adapter 声明。
  hyper_hidden_dims: []  # 正整数列表；默认超网络直接输出线性权重，再取绝对值。
  value_backbone:
    kind: mlp
    hidden_dims: []
    output_dim: 32
    layer_norm: false

loss:
  td_coefficient: 1  # 可选；TD MSE 权重，必须 >= 0。

value_target:
  kind: td0  # 可选；组件实现名称，默认值如本行。
  gamma: 0.99  # 可选；折扣因子，范围 [0,1]。

replay:
  capacity: 100000  # 可选；replay 容量，必须 >= 1。
  batch_size: 256  # 可选；每次 replay 采样量，1 <= batch_size <= capacity。

update:
  learning_rate: 0.0003  # 可选；Adam 学习率，必须 > 0。
  max_grad_norm: 10  # 可选；梯度范数上限，必须 > 0；null 关闭裁剪。
  amp_dtype: null  # 可选；null 使用 FP32；bf16 需要支持 BF16 的 CUDA。

target_update:
  kind: soft  # 可选；组件实现名称，默认值如本行。
  tau: 0.005  # 可选；Polyak 更新系数，范围 (0,1]。
# target_update 也可整节替换为 {kind: hard, interval: 1}；interval 是正整数。
