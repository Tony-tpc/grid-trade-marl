# MAPPO 完整默认配置；以下值与 Python MAPPOConfig() 一致。
# 仅 schema_version 和 algorithm 必填；其余节或字段省略时使用这里的默认值。
schema_version: 1  # 必填；配置版本，只允许整数 1。
algorithm: mappo  # 必填；选择对应配置类型，切换算法应换整份 YAML。

policy:
  layer_norm: false  # 可选；各隐藏层 LayerNorm，默认关闭。
  kind: independent_discrete  # 可选；组件实现名称，默认值如本行。
  hidden_dim: 128  # 可选；隐藏层宽度，必须 > 0。

critic:
  layer_norm: false  # 可选；critic 隐藏层 LayerNorm，默认关闭。
  kind: centralized_value  # 可选；组件实现名称，默认值如本行。
  hidden_dim: 128  # 可选；隐藏层宽度，必须 > 0。

loss:
  normalize_targets: false  # 可选；逐智能体 target 运行尺度，保留原始 V/Q 单位。
  clip_ratio: 0.2  # 可选；PPO ratio 对称裁剪宽度，范围 (0,1)。
  value_coefficient: 0.5  # 可选；value MSE 权重，必须 >= 0。
  entropy_coefficient: 0.01  # 可选；探索熵权重，必须 >= 0。

advantage:
  kind: gae  # 可选；组件实现名称，默认值如本行。
  gamma: 0.99  # 可选；折扣因子，范围 [0,1]。
  lambda: 0.95  # 可选；GAE 递推系数，范围 [0,1]。
  normalize: true  # 可选；是否对 advantage 做 batch 标准化；return 不变。
  normalization_scope: per_agent  # 可选；per_agent 保留个体奖励尺度，global 复现旧行为。

rollout:
  horizon: null  # 可选；null 使用环境 horizon，否则 1 <= horizon <= 环境 horizon。

update:
  learning_rate: 0.0003  # 可选；专用学习率为 null 时的兼容默认值，必须 > 0。
  actor_learning_rate: null  # 可选；null 回退 learning_rate。
  critic_learning_rate: null  # 可选；null 回退 learning_rate。
  epochs: 4  # 可选；每份 fresh rollout 的更新轮数，必须 >= 1。
  mini_batch_size: 256  # 可选；展平 [T,B] 后的 mini-batch 大小，必须 >= 1。
  max_grad_norm: 10  # 可选；专用上限为 null 时的兼容默认值。
  actor_max_grad_norm: null  # 可选；null 回退 max_grad_norm。
  critic_max_grad_norm: null  # 可选；null 回退 max_grad_norm。
  value_clip_ratio: null  # 可选；正数启用基于 old value 的 PPO value clipping。
