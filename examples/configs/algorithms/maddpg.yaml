# MADDPG 完整默认配置；以下值与 Python MADDPGConfig() 一致。
# 仅 schema_version 和 algorithm 必填；其余节或字段省略时使用这里的默认值。
schema_version: 2  # 必填；配置版本，只允许整数 2。
algorithm: maddpg  # 必填；选择对应配置类型，切换算法应换整份 YAML。

policy:
  kind: independent_deterministic  # 可选；组件实现名称，默认值如本行。
  encoder: {kind: identity}  # history 可选 GRU/LSTM/Transformer。
  backbone:
    kind: mlp
    hidden_dims: [128, 128]  # 正整数列表；允许 []。
    output_dim: 128
    layer_norm: false

critic:
  kind: independent_centralized_q  # 可选；组件实现名称，默认值如本行。
  encoder: {kind: identity}
  graph: null  # 仅集中式 critic 可选 GNN；动作在观测编码后按原顺序拼接。
  backbone:
    kind: mlp
    hidden_dims: [128, 128]
    output_dim: 128
    layer_norm: false

loss:
  normalize_targets: false  # 可选；逐智能体 target 运行尺度，保留原始 V/Q 单位。
  td_coefficient: 1  # 可选；TD MSE 权重，必须 >= 0。

value_target:
  kind: td0  # 可选；组件实现名称，默认值如本行。
  gamma: 0.99  # 可选；折扣因子，范围 [0,1]。

replay:
  capacity: 100000  # 可选；replay 容量，必须 >= 1。
  batch_size: 256  # 可选；每次 replay 采样量，1 <= batch_size <= capacity。

update:
  learning_rate: 0.0003  # 可选；专用值为 null 时的兼容默认值。
  max_grad_norm: 10  # 可选；专用值为 null 时的兼容默认值。
  amp_dtype: null  # 可选；null 使用 FP32；bf16 需要支持 BF16 的 CUDA。
  actor_learning_rate: null  # 可选；null 回退 learning_rate。
  critic_learning_rate: null  # 可选；null 回退 learning_rate。
  actor_max_grad_norm: null  # 可选；null 回退 max_grad_norm。
  critic_max_grad_norm: null  # 可选；null 回退 max_grad_norm。

target_update:
  kind: soft  # 可选；组件实现名称，默认值如本行。
  tau: 0.005  # 可选；Polyak 更新系数，范围 (0,1]。
# target_update 也可整节替换为 {kind: hard, interval: 1}；interval 是正整数。
