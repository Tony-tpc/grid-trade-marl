# MADDPG 完整算法 recipe；连续确定性动作、个体奖励、off-policy replay。
schema_version: 1
algorithm: maddpg

policy:
  type: independent_deterministic  # 每个智能体独立的确定性连续 Actor。
  options:
    hidden_dim: 128  # 可选，默认 128；Actor 隐藏维度。

critic:
  type: independent_centralized_q  # 每个智能体一个独立的集中式 Q_i。
  options:
    hidden_dim: 128  # 可选，默认 128；每个 Critic 隐藏维度。

objectives:
  - type: td_mse
    options:
      coefficient: 1.0  # 可选，默认 1.0；critic loss 权重。
  - type: deterministic_policy  # 最大化当前联合动作下的逐智能体 Q_i。
    options: {}  # 没有可选字段。

returns:
  type: td0
  options:
    gamma: 0.99  # 可选，默认 0.99；一步 TD 折扣因子。

experience:
  type: replay
  options:
    capacity: 100000  # 可选，默认 100000。
    batch_size: 256  # 可选，默认 256。

update:
  type: off_policy_update
  options:
    learning_rate: 0.0003  # 可选，默认 0.0003。
    max_grad_norm: 10.0  # 可选，默认 10.0；null 表示关闭。
    amp_dtype: null  # 可选，默认 null；可设 bf16。

target_update:
  type: soft
  options:
    tau: 0.005  # 可选，默认 0.005；范围 (0, 1]。
