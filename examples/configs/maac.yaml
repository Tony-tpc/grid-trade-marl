schema_version: 1
algorithm: maac
policy:
  type: independent_discrete
  options: {hidden_dim: 128}
critic:
  type: attention_q
  options: {hidden_dim: 128, attention_heads: 4}
objectives:
  - {type: td_mse}
  - {type: counterfactual}
  - type: entropy
    options: {coefficient: 0.01}
returns:
  type: td0
  options: {gamma: 0.99}
experience:
  type: replay
  options: {capacity: 100000, batch_size: 256}
update:
  type: off_policy_update
  options: {learning_rate: 0.0003, max_grad_norm: 10.0}
target_update:
  type: soft
  options: {tau: 0.005}
