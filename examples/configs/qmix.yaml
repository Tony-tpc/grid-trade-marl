schema_version: 1
algorithm: qmix
policy:
  type: shared_discrete_q
  options: {hidden_dim: 128}
critic:
  type: qmix_mixer
  options: {mixing_dim: 32}
objectives:
  - {type: td_mse}
returns:
  type: td0
  options: {gamma: 0.99}
experience:
  type: replay
  options: {capacity: 100000, batch_size: 256}
update:
  type: off_policy_update
  options: {learning_rate: 0.0003, max_grad_norm: 10.0}
target_update:
  type: soft
  options: {tau: 0.005}
