schema_version: 1
algorithm: masac
policy:
  type: independent_gaussian
  options: {hidden_dim: 128}
critic:
  type: twin_independent_centralized_q
  options: {hidden_dim: 128}
objectives:
  - {type: td_mse}
  - type: sac_entropy
    options: {initial_alpha: 0.2, target_entropy: null}
returns:
  type: td0
  options: {gamma: 0.99}
experience:
  type: replay
  options: {capacity: 100000, batch_size: 256}
update:
  type: off_policy_update
  options: {learning_rate: 0.0003, max_grad_norm: 10.0}
target_update:
  type: soft
  options: {tau: 0.005}
